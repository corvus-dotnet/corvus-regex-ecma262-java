# Build (warnings denied), the tests, the generated files, the stack probe and the ECMA-262 test data, on Linux, Windows
# and Linux on arm64 (where the Vector API runs on NEON); and on Linux, the data as its own scripts write it for Unicode
# 13 and 18 and for the grammar of ECMAScript 2020. The data (github.com/corvus-dotnet/ecma262-regex-test-data) is
# pinned to a commit; the pass is 0 wrong answers, 0 refusals of a valid pattern, 0 acceptances of an invalid one and 0
# matches at their limit, in both encodings.
name: ci
on:
  push:
    branches:
    - main
  pull_request:
  schedule:
  - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      # JDK 25 builds (for Java 17) and tests; JDK 17, the oldest the library runs on, and JDK 21, the first whose Vector
      # API the library takes, test the same classes again.
      with:
        distribution: temurin
        java-version: |
          17
          21
          25
        cache: maven
    - name: The expanded templates are current
      run: python3 tools/expand.py --check
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The Unicode tables and the properties of strings are written from the Rust crate's, at the version this
      # engine ports.
      with:
        repository: corvus-dotnet/corvus-regex-ecma262-rs
        ref: 1036f8707c25b49d826501132619c5671431d685
        path: corvus-regex-ecma262-rs
        persist-credentials: false
    - name: The generated tables are current
      # The tables and the properties of strings of each version of Unicode, and the property names of ECMAScript 2020.
      run: |
        src=corvus-regex-ecma262-rs/corvus-regex-ecma262/src
        for major in 13 17 18; do
          python3 tools/unicode/gen_tables.py $src/tables$major.rs --check
          python3 tools/unicode/gen_strings.py $src/strings$major.rs --check
        done
        python3 tools/unicode/gen_es2020.py $src/es2020.rs --check
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The patterns and instances of the suite, which the tests compare the automaton and the matcher over.
      with:
        repository: json-schema-org/JSON-Schema-Test-Suite
        ref: be54236db6e8e6bb2e098ed16fb4c61e73f5a9ac
        path: JSON-Schema-Test-Suite
        persist-credentials: false
    - name: Build and test
      run: mvn -B -ntp verify
      env:
        JSON_SCHEMA_TEST_SUITE: ${{ github.workspace }}/JSON-Schema-Test-Suite
    - name: The release profile builds
      # What Maven Central needs beside the classes, sources and javadoc jars, built as maven-publish.yml builds them
      # (unsigned here), so that a release cannot fail on what pull requests never built.
      run: mvn -B -ntp -P release -Dgpg.skip -DskipTests package
    - name: Test on Java 17 and Java 21, in both modes
      # The classes JDK 25 built, run by JDK 17 (where the searches stay SWAR with the module added) and by JDK 21 (the
      # first whose Vector API they take).
      if: runner.os == 'Linux'
      run: |
        mvn -B -ntp surefire:test@default-test surefire:test@vector -Djvm="$JAVA_HOME_17_X64/bin/java"
        mvn -B -ntp surefire:test@default-test surefire:test@vector -Djvm="$JAVA_HOME_21_X64/bin/java"
      env:
        JSON_SCHEMA_TEST_SUITE: ${{ github.workspace }}/JSON-Schema-Test-Suite
    - name: Test with the memory of failed places from the first step
      if: runner.os == 'Linux'
      run: mvn -B -ntp test -DcorvusArgLine=-Dcorvus.regex.memoFromTheStart=true
      env:
        JSON_SCHEMA_TEST_SUITE: ${{ github.workspace }}/JSON-Schema-Test-Suite
    - name: The benchmark harness builds
      if: runner.os == 'Linux'
      run: |
        tools/benchmarks/build.sh
        javac -encoding UTF-8 -Xlint:all -Werror -d target/harness/check -cp target/harness/lib tools/benchmarks/Industry.java
        python3 -m py_compile tools/benchmarks/industry-results.py tools/benchmarks/tregex-compliance.py
    - name: Probe for stack overflows
      # Deep, wide and long patterns in every grammar through every member, each on threads with stacks of 8 MB, 1 MB
      # and 256 KB: none may overflow (tools/stackprobe/StackProbe.java).
      run: |
        javac -encoding UTF-8 -Xlint:all -Werror -d tools/stackprobe/out -cp target/classes tools/stackprobe/StackProbe.java
        java -Xmx4g -cp "target/classes${{ runner.os == 'Windows' && ';' || ':' }}tools/stackprobe/out" StackProbe
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: corvus-dotnet/ecma262-regex-test-data
        ref: 36e8b71c181fa10554760f461dc8c526fd3ffb42
        path: ecma262-regex-test-data
        persist-credentials: false
    - name: The checked-in counts were made at this commit of the test data
      # The compliance of an engine too slow to judge every night is checked in beside the harness, with the commit of
      # the data it was made at (dataCommit); the benchmark page judges it against that commit. Moving the pin above
      # means working them out again (README.md), so they cannot fall behind it unnoticed.
      if: runner.os == 'Linux'
      shell: bash
      run: |
        pin=$(git -C ecma262-regex-test-data rev-parse HEAD)
        fail=0
        for f in $(git ls-files | grep -E '(^|/)compliance-[^/]*\.json$'); do
          made=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("dataCommit", "none"))' "$f")
          if [ "$made" != "$pin" ]; then
            echo "::error file=$f::$f was made at $made, not the data CI checks out ($pin): work its counts out again at that commit."
            fail=1
          fi
        done
        exit $fail
    - name: Run the ECMA-262 test data
      run: |
        javac -encoding UTF-8 -Xlint:all -Werror -d tools/dataset/out -cp target/classes tools/dataset/Dataset.java
        java -Xss4m -cp "target/classes${{ runner.os == 'Windows' && ';' || ':' }}tools/dataset/out" Dataset ecma262-regex-test-data/data wrong-cases.tsv
    - name: Run the ECMA-262 test data with the Vector API's searches
      run: >-
        java -Xss4m --add-modules jdk.incubator.vector -cp "target/classes${{ runner.os == 'Windows' && ';' || ':' }}tools/dataset/out"
        Dataset ecma262-regex-test-data/data wrong-cases-vector.tsv
    - name: Run the ECMA-262 test data with the memory of failed places from the first step
      if: runner.os == 'Linux'
      run: >-
        java -Xss4m -Dcorvus.regex.memoFromTheStart=true -cp target/classes:tools/dataset/out Dataset
        ecma262-regex-test-data/data wrong-cases-memo.tsv
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: runner.os == 'Linux'
      with:
        node-version: '24.22.1'
    - name: Run the ECMA-262 test data for other versions of Unicode and for ECMAScript 2020
      # The data as its own scripts write it for Unicode 13 and 18 (unicode.js apply) and for the grammar of
      # ECMAScript 2020 (edition.js apply), each judged with the engine set to match.
      if: runner.os == 'Linux'
      shell: bash
      run: |
        data=ecma262-regex-test-data
        failed=()
        run() {
          name=$1; shift
          out="$RUNNER_TEMP/$name"
          case "$1" in
            unicode.js) node "$data/unicode.js" apply "$2" "$out" "$data/data" ;;
            edition.js) node "$data/edition.js" apply "$out" "$2" "$data/data" ;;
          esac
          shift 2
          java -Xss4m -cp target/classes:tools/dataset/out Dataset "$out" "wrong-cases-$name.tsv" "$@" || failed+=("$name")
        }
        run unicode-13 unicode.js 13.0 --unicode 13
        run unicode-18 unicode.js 18.0 --unicode 18
        # An empty version is the data's own Unicode.
        run es2020 edition.js "" --edition es2020
        run es2020-unicode-13 edition.js 13.0 --edition es2020 --unicode 13
        if [ ${#failed[@]} -gt 0 ]; then echo "::error::Wrong: ${failed[*]}"; exit 1; fi
    - name: Keep the wrong cases
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: wrong-cases-${{ matrix.os }}
        path: wrong-cases*.tsv

  gate:
    # The one check of this workflow that the ruleset of main requires: it passes when every job above passed (or was
    # skipped), so a job added here is required with no change to the ruleset.
    name: CI gate
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
    - name: Every job passed
      env:
        RESULTS: ${{ toJSON(needs.*.result) }}
      run: |
        echo "$RESULTS"
        if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then exit 1; fi
