# Publishes io.github.corvus-dotnet:corvus-regex-ecma262 to Maven Central when a GitHub release tagged v<version> is
# published, which auto-release.yml does after a merged pull request that changed the library. The version is the tag's:
# pom.xml holds 0.0.0-SNAPSHOT, and tools/release/stamp.ps1 writes the tag's version into it before the build (it is
# never committed). A version already on Maven Central publishes nothing, so re-running a release's job is safe. A harness
# release (a tag starting harness-) publishes the harness image alone (harness-image.yml).
#
# It runs in the maven-central environment (deployments from main and from v* tags only), whose secrets are a Central
# Portal user token (CENTRAL_TOKEN_USERNAME, CENTRAL_TOKEN_PASSWORD) and the signing key (GPG_PRIVATE_KEY,
# GPG_PASSPHRASE); the io.github.corvus-dotnet namespace is verified on central.sonatype.com. A published version can
# never be replaced or deleted.
name: maven-publish
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: maven-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !startsWith(github.event.release.tag_name, 'harness-') }}
    name: Publish corvus-regex-ecma262
    runs-on: ubuntu-latest
    environment: maven-central
    # The publication, then up to an hour for Maven Central to serve it and half an hour for javadoc.io.
    timeout-minutes: 150
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Take the version from the tag and ask whether Maven Central has it
      id: version
      env:
        TAG: ${{ github.event.release.tag_name }}
        TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
        TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
      run: |
        if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
          echo "::error::The release's tag is $TAG, which is not v<major>.<minor>.<patch>."
          exit 1
        fi
        version=${BASH_REMATCH[1]}
        echo "version=$version" >> "$GITHUB_OUTPUT"
        # The Central Portal knows a version as soon as it is published (the repository mirrors it later).
        auth=$(printf '%s:%s' "$TOKEN_USERNAME" "$TOKEN_PASSWORD" | base64 -w0)
        published=$(curl -sf -H "Authorization: Bearer $auth" \
          "https://central.sonatype.com/api/v1/publisher/published?namespace=io.github.corvus-dotnet&name=corvus-regex-ecma262&version=$version" \
          | sed -n 's/.*"published":\(true\|false\).*/\1/p')
        if [ -z "$published" ]; then
          echo "::error::The Central Portal did not say whether corvus-regex-ecma262 $version is published."
          exit 1
        fi
        echo "published=$published" >> "$GITHUB_OUTPUT"
        if [ "$published" = "true" ]; then
          echo "::notice::corvus-regex-ecma262 $version is already on Maven Central; nothing to publish."
        fi
    - name: Java
      # JDK 25 builds the library for Java 17 (the Vector API's searches compile against the incubating module, whose
      # warning only JDK 25's javac can leave out), as ci.yml builds it.
      if: steps.version.outputs.published == 'false'
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: '25'
        server-id: central
        server-username: CENTRAL_TOKEN_USERNAME
        server-password: CENTRAL_TOKEN_PASSWORD
        gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
        gpg-passphrase: MAVEN_GPG_PASSPHRASE
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The patterns and instances of the suite, which the tests compare the automaton and the matcher over.
      if: steps.version.outputs.published == 'false'
      with:
        repository: json-schema-org/JSON-Schema-Test-Suite
        ref: be54236db6e8e6bb2e098ed16fb4c61e73f5a9ac
        path: JSON-Schema-Test-Suite
        persist-credentials: false
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      if: steps.version.outputs.published == 'false'
      with:
        repository: corvus-dotnet/ecma262-regex-test-data
        ref: 36e8b71c181fa10554760f461dc8c526fd3ffb42
        path: ecma262-regex-test-data
        persist-credentials: false
    - name: Write the version into pom.xml
      if: steps.version.outputs.published == 'false'
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: pwsh -NoProfile -File tools/release/stamp.ps1 -Tag "$TAG"
    - name: The tests, in both modes
      if: steps.version.outputs.published == 'false'
      env:
        JSON_SCHEMA_TEST_SUITE: ${{ github.workspace }}/JSON-Schema-Test-Suite
      run: mvn -B -ntp verify
    - name: The ECMA-262 test data, in both modes
      if: steps.version.outputs.published == 'false'
      run: |
        javac -encoding UTF-8 -d tools/dataset/out -cp target/classes tools/dataset/Dataset.java
        java -Xss4m -cp target/classes:tools/dataset/out Dataset ecma262-regex-test-data/data wrong-cases.tsv
        java -Xss4m --add-modules jdk.incubator.vector -cp target/classes:tools/dataset/out Dataset ecma262-regex-test-data/data wrong-cases.tsv
    - name: Sign and publish
      if: steps.version.outputs.published == 'false'
      env:
        CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
        CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        mvn -B -ntp deploy -P release -DskipTests
        {
          echo "### corvus-regex-ecma262 $VERSION is published"
          echo
          echo "https://central.sonatype.com/artifact/io.github.corvus-dotnet/corvus-regex-ecma262/$VERSION"
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Ask javadoc.io for the release's javadoc
      # javadoc.io serves a version's javadoc (the -javadoc.jar beside it on Maven Central) only once it has synced its
      # list of versions from Maven, which it does not do by itself: this waits for Central to serve the jar, presses
      # javadoc.io's "Sync from Maven" (a form with a CSRF token), and waits for the version's pages. javadoc.io failing
      # to answer is a warning, not a failed release: the release is published, and the sync can be pressed by hand.
      env:
        VERSION: ${{ steps.version.outputs.version }}
        GA: io.github.corvus-dotnet/corvus-regex-ecma262
      run: |
        jar="https://repo1.maven.org/maven2/$GA/$VERSION/corvus-regex-ecma262-$VERSION-javadoc.jar"
        page="https://javadoc.io/static/$GA/$VERSION/index.html"
        ok() { [ "$(curl -s -o /dev/null -w '%{http_code}' "$1")" = 200 ]; }
        for i in $(seq 1 60); do ok "$jar" && break; echo "Maven Central does not serve the javadoc jar yet ($i)."; sleep 60; done
        if ! ok "$jar"; then
          echo "::warning::Maven Central did not serve $jar within an hour: sync javadoc.io by hand (https://javadoc.io/doc/$GA)."
          exit 0
        fi
        for attempt in 1 2 3; do
          ok "$page" && break
          cookies="$RUNNER_TEMP/javadoc-io-cookies"
          token=$(curl -s -c "$cookies" "https://javadoc.io/versions/$GA" | grep -o 'name="csrfToken" value="[^"]*"' | head -n 1 | sed 's/.*value="//; s/"$//')
          curl -s -o /dev/null -b "$cookies" -X POST --data-urlencode "csrfToken=$token" "https://javadoc.io/versions/$GA/sync"
          for i in $(seq 1 10); do ok "$page" && break; sleep 60; done
        done
        if ok "$page"; then
          echo "javadoc.io serves $VERSION: https://javadoc.io/doc/$GA/$VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
        else
          echo "::warning::javadoc.io does not serve $VERSION after three syncs: sync it by hand (https://javadoc.io/doc/$GA)."
        fi
